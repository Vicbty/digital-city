<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>EcoVille Digital</title>
<meta name="description" content="Your town is hooked on screens. Cut its digital footprint step by step until it reaches net zero.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#cfd8b0">
<!-- iPhone : ajout à l'écran d'accueil -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EcoVille">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<!-- Partage (WhatsApp, Insta, LinkedIn…) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="EcoVille Digital">
<meta property="og:title" content="EcoVille Digital — bring your town's digital footprint to net zero">
<meta property="og:description" content="Coal-powered data centers, phones replaced every year, e-waste in a dump… Can you fix your town?">
<meta property="og:image" content="/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: cheerful, tactile city-builder that teaches the hidden footprint of screens, clouds and cables
   IDEA: a floating diorama town wired to data centres; its sky clears as its digital life gets lighter
   PICTURE: full-bleed isometric canvas: blinking server halls, antennas, e-waste heaps, homes glowing blue
   COLOUR and TYPE: sky blue + leaf green fields, forest ink, coin-gold accent, server-cyan detail; Fredoka + Nunito
   LAYOUT: HUD chips top, goal card left, tool rail right, dock bottom, drawer right / bottom sheet on phones */
:root{color-scheme:light dark;--ink:light-dark(#12352a,#e8f6ee);--mut:light-dark(#4d6b5f,#9fc0b1);--panel:light-dark(rgba(255,255,255,.94),rgba(14,30,23,.94));--line:light-dark(rgba(18,53,42,.12),rgba(232,246,238,.14));--soft:light-dark(#eef7f1,#1c3a2d);--leaf:#1f9d5a;--leaf2:light-dark(#178a4e,#3cc77d);--gold:#ffc23d;--bad:#d9534f;--cyan:light-dark(#0e7fa8,#5ad1ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:#bfe3f4;color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow:hidden}
#app{position:relative;height:100dvh;min-height:540px;overflow:hidden;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#cv.plant{cursor:copy}#cv.drag{cursor:grabbing}
h1,h2,h3,.fred{font-family:Fredoka,Nunito,sans-serif;font-weight:600}
.card{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:18px;box-shadow:0 8px 28px rgba(8,40,26,.18);border:1px solid var(--line)}
svg.i{width:22px;height:22px;flex:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:3}
.hud>*{pointer-events:auto}
.town{display:flex;gap:10px;align-items:center;padding:8px 14px 8px 8px;min-width:220px}
.lvl{width:46px;height:46px;border-radius:14px;background:linear-gradient(160deg,#3fcf7f,#178a4e);color:#fff;display:grid;place-items:center;font:700 22px Fredoka,sans-serif;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.tname{font:600 17px/1.1 Fredoka,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.lname{font-size:13px;color:var(--mut);font-weight:700}
.bar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3fcf7f,#ffc23d);border-radius:9px;transition:width .4s}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 18px rgba(8,40,26,.14);white-space:nowrap}
.chip b{font:600 17px Fredoka,sans-serif}.chip small{font-size:12px;color:var(--mut);font-weight:700}
.chip.co2 b{color:var(--c,#b4572f)}
.mission{position:absolute;top:84px;left:10px;width:300px;padding:12px 14px;z-index:2}
.mission h3{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.mission .row{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:8px}
.mission .row .bar{flex:1;margin:0}
.ok{color:var(--leaf2);font-weight:800}.no{color:var(--bad);font-weight:800}
.hint{margin-top:10px;padding:8px 10px;border-radius:12px;background:var(--soft);font-size:13.5px;line-height:1.35}
.hint button{color:var(--leaf2);font-weight:800;text-decoration:underline;padding:0}
.mission.min .body{display:none}
.rail{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:2}
.rb{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 18px rgba(8,40,26,.14);position:relative}
.rb:hover{transform:translateY(-1px)}.rb.on{background:var(--leaf);color:#fff}
.rb.gold{background:linear-gradient(160deg,#ffd567,#f3a913);color:#5a3b00;border:0}
.dock{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:6px;z-index:3;max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none}
.db{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:66px;height:60px;padding:4px 8px;border-radius:14px;font-size:12.5px;font-weight:800;flex:none}
.db:hover{background:var(--soft)}.db.on{background:var(--leaf);color:#fff}
.db.guide{color:var(--cyan)}
.db kbd{position:absolute;top:3px;right:5px;font:700 10px Nunito,sans-serif;opacity:.5}
.badge{position:absolute;top:-2px;left:calc(50% + 6px);min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#e8453c;color:#fff;font:700 11px/19px Nunito,sans-serif;text-align:center}
.badge:empty{display:none}
.drawer{position:absolute;right:66px;top:76px;bottom:88px;width:390px;max-width:calc(100% - 86px);display:flex;flex-direction:column;z-index:4;transform:translateX(calc(100% + 90px));transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
.dh h2{margin:0;font-size:21px}
.dbody{overflow-y:auto;padding:6px 16px 16px;flex:1}
.x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}.x:hover{background:var(--soft)}
.sub{color:var(--mut);font-size:13.5px;margin:0 0 10px}
.why{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:12px;background:color-mix(in srgb,var(--cyan) 10%,transparent);font-size:13.5px;line-height:1.4;margin:0 0 10px}
.why svg{flex:none;width:18px;height:18px;color:var(--cyan);margin-top:1px}
.item{border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px;background:light-dark(#fff,rgba(255,255,255,.03))}
.item.hot{border-color:var(--leaf2);box-shadow:0 0 0 2px color-mix(in srgb,var(--leaf2) 25%,transparent)}
.it{display:flex;justify-content:space-between;gap:8px;align-items:center}
.it b{font:600 15.5px Fredoka,sans-serif}
.meta{font-size:13px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px}
.pb{height:9px;border-radius:9px;background:var(--soft);overflow:hidden;margin:8px 0 4px}
.pb i{display:block;height:100%;background:var(--leaf2);border-radius:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:12px;background:var(--leaf);color:#fff;font-weight:800;font-size:14px;white-space:nowrap;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:none}
.btn.gold{background:linear-gradient(160deg,#ffd567,#f3a913);color:#4b3200}
.btn[disabled]{background:var(--soft);color:var(--mut);box-shadow:none;cursor:not-allowed}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.dots{display:flex;gap:4px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}.dots i.f{background:var(--leaf2);border-color:transparent}
.big{font:600 24px/1.1 Fredoka,sans-serif;margin:4px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px;margin:10px 0}
.kv span:nth-child(even){font-weight:800;text-align:right;white-space:nowrap}
.delta{color:var(--leaf2);font-weight:800}
.rk{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:12px}
.rk:nth-child(odd){background:var(--soft)}
.rk.me{outline:2px solid var(--leaf2)}
.rk .pos{font:700 17px Fredoka,sans-serif;text-align:center}
.rk .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .nm small{display:block;color:var(--mut);font-weight:700;font-size:12px}
.rk .sc{text-align:right;font:600 16px Fredoka,sans-serif;white-space:nowrap}
.tag{display:inline-block;font:800 10.5px Nunito,sans-serif;padding:1px 6px;border-radius:6px;background:var(--soft);color:var(--mut);vertical-align:1px;margin-left:4px}
.tag.g{background:#d9f6e5;color:#13703f}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:8px 0}
.toggle input{width:20px;height:20px;accent-color:var(--leaf)}
.g-sec{margin:0 0 18px}.g-sec h3{margin:0 0 8px;font-size:17px}
.g-steps{counter-reset:s;margin:0;padding:0;list-style:none}
.g-steps li{counter-increment:s;position:relative;padding:0 0 10px 36px;font-size:14.5px;line-height:1.4}
.g-steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;background:var(--leaf);color:#fff;font:700 14px/26px Fredoka,sans-serif;text-align:center}
.g-act{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.g-act .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--leaf2)}
.g-act b{font:600 15px Fredoka,sans-serif;display:block}
.g-act .gain{color:var(--leaf2);font-weight:800;font-size:13px}
.g-bld{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.4}
.g-bld b{font-size:14.5px}
.modal{position:absolute;inset:0;background:rgba(8,30,20,.42);display:none;place-items:center;z-index:10;padding:16px}
.modal.open{display:grid}
.mbox{width:min(480px,100%);max-height:calc(100% - 20px);overflow:auto;padding:22px;border-radius:22px;background:var(--panel);box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative;animation:pop .25s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.mbox h2{margin:0 0 6px;font-size:25px;line-height:1.12;text-wrap:balance;padding-right:30px}
.mbox p{margin:6px 0}
.mbox .x{position:absolute;top:10px;right:10px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:2px solid var(--line);margin:8px 0;font-weight:700;font-size:15px;background:light-dark(#fff,rgba(255,255,255,.03))}
.opt:hover{border-color:var(--leaf2)}
.opt.right{border-color:var(--leaf2);background:color-mix(in srgb,var(--leaf2) 15%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.fact{padding:10px 12px;border-radius:12px;background:var(--soft);font-size:14.5px;margin-top:10px}
input[type=text]{width:100%;font:700 17px Nunito,sans-serif;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:light-dark(#fff,#0f2219);color:var(--ink);margin:10px 0}
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.bin{border-radius:16px;padding:12px 6px 10px;color:#fff;font-weight:800;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:96px;justify-content:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);text-align:center;line-height:1.2}
.bin svg{width:32px;height:32px}
.waste{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;border-radius:18px;background:var(--soft);margin-top:12px;text-align:center}
.waste svg{width:76px;height:64px}
.waste b{font:600 19px/1.2 Fredoka,sans-serif}
.facade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px;border-radius:16px;background:#2b3440;margin-top:12px}
.dev{aspect-ratio:1.45/1;border-radius:10px;background:#3b4656;border:2px solid #4c5868;color:#c9d3df;font-weight:800;font-size:12.5px;position:relative;display:grid;place-items:center;transition:background .12s}
.dev::after{content:"";position:absolute;right:7px;bottom:6px;width:7px;height:7px;border-radius:50%;background:#1d242c}
.dev.lit{border-color:#ffb020;background:#4a4030;color:#fff}
.dev.lit::after{background:#ff4530;box-shadow:0 0 8px 2px #ff6a3d}
.timer{height:10px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:10px}.timer i{display:block;height:100%;background:var(--gold)}
.rew{display:flex;gap:14px;justify-content:center;margin:14px 0;font:600 20px Fredoka,sans-serif;flex-wrap:wrap}
.rew span{display:flex;align-items:center;gap:6px}
.unl{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.unl span{padding:5px 10px;border-radius:10px;background:var(--soft);font-weight:800;font-size:13.5px}
.slide-ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--soft);color:var(--leaf2);margin-bottom:10px}
.slide-ic svg{width:36px;height:36px}
.sdots{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}.sdots i{width:8px;height:8px;border-radius:50%;background:var(--soft)}.sdots i.f{background:var(--leaf2);width:22px;border-radius:5px}
.slide ul{margin:8px 0;padding-left:20px;font-size:15px;line-height:1.45}.slide li{margin:4px 0}
.toasts{position:absolute;left:50%;top:84px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:6;pointer-events:none;width:max-content;max-width:92%}
.toast{padding:9px 16px;border-radius:14px;background:var(--panel);box-shadow:0 8px 24px rgba(0,0,0,.18);font-weight:800;font-size:14px;animation:tin .25s ease-out;text-align:center}
.toast.bad{color:var(--bad)}.toast.good{color:var(--leaf2)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.tip{position:absolute;pointer-events:none;z-index:5;padding:7px 11px;border-radius:12px;background:var(--panel);box-shadow:0 6px 18px rgba(0,0,0,.18);font-size:13px;font-weight:700;display:none;max-width:260px}
.tip b{font:600 14.5px Fredoka,sans-serif;display:block}
.coach{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);z-index:5;display:none;align-items:center;gap:10px;padding:10px 12px 10px 16px;width:min(500px,calc(100% - 20px));font-size:14.5px;font-weight:700;border:2px solid var(--gold)}
.coach.on{display:flex}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.keys kbd{font:800 12px Nunito,sans-serif;padding:3px 8px;border-radius:7px;background:var(--soft);border:1px solid var(--line);text-align:center}
.note{font-size:12.5px;color:var(--mut);margin-top:10px}
button.chip{cursor:pointer;font:inherit;color:inherit}button.chip:hover{border-color:var(--gold)}
.rate{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0}
.rate button{height:48px;border-radius:12px;background:var(--soft);font:600 19px Fredoka,sans-serif;border:2px solid transparent}
.rate button:hover{border-color:var(--gold)}.rate button.on{background:var(--gold);color:#4b3200}
.rscale{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);font-weight:700;margin-top:-6px}
.cstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 6px}
.cstats div{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.cstats b{display:block;font:600 22px Fredoka,sans-serif}.cstats span{font-size:12px;color:var(--mut);font-weight:700}
.hist{display:grid;grid-template-columns:22px minmax(0,1fr) 30px;gap:4px 8px;align-items:center;font-size:12.5px;font-weight:700}
.hist i{display:block;height:10px;border-radius:6px;background:var(--gold);min-width:2px}.hist span:last-child{text-align:right;color:var(--mut)}
@media(max-width:700px){
 .mission{top:auto;bottom:84px;left:10px;width:auto;right:10px;padding:9px 12px}
 .stats .chip small{display:none}
 .chip{padding:6px 9px}.chip b{font-size:15px}
 .town{min-width:0;padding:6px 10px 6px 6px}.lvl{width:38px;height:38px;font-size:18px}.tname{max-width:150px;font-size:15px}
 .drawer{left:0;right:0;top:auto;bottom:0;width:auto;max-width:none;height:70%;border-radius:22px 22px 0 0;transform:translateY(105%)}
 .db{height:54px;font-size:10.5px;min-width:0;flex:1 1 0;padding:2px 0}.db kbd{display:none}
 .dock{left:6px;right:6px;transform:none;max-width:none;justify-content:space-between;gap:0;padding:4px}
 .coach{bottom:150px}.toasts{top:128px}
 .hud{flex-direction:column}.stats{justify-content:flex-start}
 .rail{top:130px;bottom:auto;transform:none;gap:6px}.rail .rb{width:42px;height:42px}.rail [data-k=zin],.rail [data-k=zout],.rail [data-k=center]{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function snd(k){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const seq={coin:[[988,.06],[1319,.1]],up:[[523,.08],[659,.08],[784,.08],[1047,.16]],bad:[[220,.14]],pick:[[740,.07]],lvl:[[523,.1],[659,.1],[784,.1],[1047,.1],[1319,.25]],ok:[[660,.08],[880,.12]]}[k]||[];let t=AC.currentTime;for(const[f,d]of seq){const o=AC.createOscillator(),g=AC.createGain();o.type=k==='bad'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.85}}catch(e){}}

/* ---------- Actions ---------- */
let uiQ=false,dirty=false;function changed(){S.t=Date.now();dirty=true;if(!uiQ){uiQ=true;requestAnimationFrame(()=>{uiQ=false;ui();renderDrawer()})}}
function toast(m,c=''){const d=document.createElement('div');d.className='toast '+c;d.textContent=m;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),2800);while($('#toasts').children.length>3)$('#toasts').firstChild.remove()}
function bump(k,n=1){S.tasks.forEach(t=>{if(t.k===k)t.p=Math.min(t.n,t.p+n)})}
function gain(c,x){S.coins+=c;S.xp+=x}
function collect(s,quiet){if(!ready(s))return false;const amt=Math.round(K[s.k].t[S.tier[s.id]][2]*mult());gain(amt,1);S.prod[s.id]=Date.now();ft(s.i,s.j,'+'+amt,'#ffd34d');const[x,y]=iso(s.i,s.j);sparkle(x,y-K[s.k].h,4,'255,200,60');bump('collect');if(!quiet)snd('coin');if(S.tut===0)advTut(1);check();changed();return true}
function collectAll(){let n=0;SLOTS.forEach(s=>{if(collect(s,true))n++});if(n){snd('coin');toast(`Collected coins from ${n} building${n>1?'s':''}`,'good')}else toast('Nothing to collect yet: buildings are still working')}
function upgrade(id){const s=SL[id],k=K[s.k],ti=S.tier[id];if(ti>=3)return;const nx=k.t[ti+1];
 if(S.level<nx[4]){toast(`${nx[0]} unlocks at level ${nx[4]}`,'bad');snd('bad');return}
 if(S.coins<nx[3]){toast(`You need ${fmt(nx[3]-S.coins)} more coins`,'bad');snd('bad');return}
 const d=k.t[ti][1]-nx[1],xp=Math.round(nx[3]/10)+5;S.coins-=nx[3];S.tier[id]=ti+1;S.xp+=xp;S.prod[id]=Date.now();
 const[x,y]=iso(s.i,s.j);sparkle(x,y-20,26);ft(s.i,s.j,`−${d} t CO₂`,'#5dff9a');ft(s.i,s.j,'+'+xp+' XP','#c9b8ff',-16);snd('up');toast(`${k.t[ti][0]} → ${nx[0]}`,'good');bump('upgrade');if(S.tut<=2)advTut(3);check();changed()}
const canPlant=(i,j)=>i>=0&&j>=0&&i<N&&j<N&&G[i][j]==='g'&&!S.trees.some(t=>t[0]===i&&t[1]===j);
function plant(i,j){if(S.trees.length>=BOX_MAX){toast('Your town already has every drop-off box it needs','bad');return}if(!canPlant(i,j)){toast('Drop-off boxes go on an empty grass tile','bad');snd('bad');return}if(S.coins<BOX_COST){toast(`A drop-off box costs ${BOX_COST} coins`,'bad');snd('bad');return}
 S.coins-=BOX_COST;S.xp+=3;S.trees.push([i,j,rnd(-5,5)|0,rnd(-2,2)|0]);LT=LT.filter(l=>!(l.i===i&&l.j===j));
 const[x,y]=iso(i,j);sparkle(x,y-10,12);ft(i,j,'−2 t CO₂','#5dff9a',20);snd('ok');bump('plant');check();changed()}
function pickLitter(l){LT.splice(LT.indexOf(l),1);const c=Math.round(3*scale());gain(c,1);ft(l.i,l.j,'+'+c,'#ffd34d',30);snd('pick');bump('litter');check();changed()}
function check(){let lv=0;while(S.level<10&&S.xp>=LV[S.level-1].xp&&co2()<=LV[S.level-1].co2){S.level++;lv=S.level;S.coins+=50*S.level}
 if(lv){snd('lvl');confetti();showLevel(lv)}
 if(S.level===10&&co2()<=0&&!S.won){S.won=true;setTimeout(showWin,lv?2500:300)}}
function newTask(){const have=S.tasks.map(t=>t.k);let ks=Object.keys(TK).filter(k=>!have.includes(k));if(S.trees.length>=BOX_MAX-2)ks=ks.filter(k=>k!=='plant');if(SLOTS.every(s=>S.tier[s.id]>=3))ks=ks.filter(k=>k!=='upgrade');const k=pick(ks),d=TK[k],n=pick(d.n);return{k,n,p:0,c:Math.round(n*d.c*scale()),x:Math.round(n*d.x*scale())}}
function fillTasks(){while(S.tasks.length<3)S.tasks.push(newTask())}
function bestMove(){const op=[];SLOTS.forEach(s=>{const ti=S.tier[s.id];if(ti>=3)return;const nx=K[s.k].t[ti+1];if(nx[4]>S.level)return;op.push({s,nx,d:K[s.k].t[ti][1]-nx[1],from:K[s.k].t[ti][0]})});if(!op.length)return null;const aff=op.filter(o=>o.nx[3]<=S.coins);return(aff.length?aff:op).sort((a,b)=>aff.length?b.d/b.nx[3]-a.d/a.nx[3]:a.nx[3]-b.nx[3])[0]}

 if(m._h!==mh){m._h=mh;m.innerHTML=mh}
 $('#bgReady').textContent=SLOTS.filter(ready).length||'';
 $('#bgTasks').textContent=S.tasks.filter(t=>t.p>=t.n).length||'';

 $('#bMute').innerHTML=`<svg class="i"><use href="#i-${S.mute?'mute':'sound'}"/></svg>`;$('#bLbl').classList.toggle('on',!!S.lbl);

 else if(panelName==='build'){T.textContent='Upgrade';const arr=[...SLOTS].sort((a,b)=>{const sc=s=>{const ti=S.tier[s.id];if(ti>=3)return 3;const nx=K[s.k].t[ti+1];return nx[4]>S.level?2:nx[3]>S.coins?1:0};return sc(a)-sc(b)});
  b.innerHTML=why('<b>What for?</b> Upgrading is the main way to win. Each building has 4 stages, from polluting to clean. An upgrade <b>cuts digital CO₂</b>, gives <b>XP</b> and makes the building <b>earn more coins</b>. Green outline = you can afford it now.')+arr.map(s=>{const k=K[s.k],ti=S.tier[s.id],cur=k.t[ti],nx=k.t[ti+1];return`<div class="item ${nx&&nx[4]<=S.level&&nx[3]<=S.coins?'hot':''}"><div class="it"><button data-k="locate" data-id="${s.id}" style="text-align:left;padding:0"><b>${esc(cur[0])}</b><div class="meta" style="margin:0"><span>${k.L}</span><span>${cur[1]} t CO₂</span></div></button>${dots(ti)}</div>${nx?`<div class="meta">Next: <b style="color:var(--ink)">${esc(nx[0])}</b><span class="delta">−${cur[1]-nx[1]} t CO₂</span><span>+${nx[2]-cur[2]} coins/cycle</span></div>`:''}<div class="acts">${upBtn(s)}</div></div>`}).join('')}
 else if(panelName==='bld'){const s=SL[panelArg],k=K[s.k],ti=S.tier[s.id],cur=k.t[ti],nx=k.t[ti+1],left=Math.max(0,Math.ceil((K[s.k].c*1000-(Date.now()-S.prod[s.id]))/1000));T.textContent=k.L;

function focusOn(s){const[x,y]=iso(s.i,s.j);const tx=W/2-x*cam.z-(W>700&&panelName?150:0),ty=H/2-(y-20)*cam.z;const sx=cam.x,sy=cam.y,t0=performance.now();const step=n=>{const k=clamp((n-t0)/350,0,1),e=1-(1-k)**3;cam.x=sx+(tx-sx)*e;cam.y=sy+(ty-sy)*e;if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}

 case'labels':S.lbl=!S.lbl;changed();break;
 case'up':upgrade(id);break;case'col':collect(SL[id]);break;
 case'locate':{const s=SL[id];sel=s;focusOn(s);openPanel('bld',id);break}
 case'claim':{const t=S.tasks[i];if(t&&t.p>=t.n){gain(t.c,t.x);S.tasks.splice(i,1,newTask());snd('up');toast(`Task complete: +${fmt(t.c)} coins, +${t.x} XP`,'good');confettiSmall();check();changed()}break}
 case'skip':if(S.coins<10){toast('Swapping a task costs 10 coins','bad');break}S.coins-=10;S.tasks.splice(i,1,newTask());changed();break;
 case'mission':$('#mission').classList.toggle('min');ui();break;
 case'mclose':if(!modalLock){const wasIntro=!S.intro&&$('#mbox').querySelector('.slide');closeModal();if(wasIntro){S.intro=true;changed();coach()}}break;
 case'ans':answer(i);break;case'bin':binPick(i);break;case'win':winTap(i);break;
 case'found':{const v=($('#tn').value||'').trim().slice(0,22);if(!v){$('#tn').focus();toast('Give your town a name first','bad');break}S.town=v;fillTasks();changed();snd('up');intro(0);break}
 case'rename':{const v=($('#rn').value||'').trim().slice(0,22);if(v){S.town=v;changed();toast('Town renamed','good')}break}
 case'reset':$('#rst').innerHTML='<p class="sub">Are you sure? This cannot be undone.</p><div class="acts"><button class="btn" style="background:var(--bad)" data-k="reset-yes">Yes, erase my town</button><button class="btn ghost" data-k="settings">Cancel</button></div>';break;
 case'reset-yes':{const keep=S.mute;S=fresh();S.mute=keep;LT=[];lastScore='';closePanel();changed();welcome();break}
 case'mute':S.mute=!S.mute;changed();break;
 case'rate':rateModal();break;case'rateset':setRating(i);break}}
function setPlant(on){plantMode=on;if(on){closePanel();toast(`Drop-off mode: tap empty grass to place a box for old phones (${BOX_COST} coins, −2 t CO₂). Press D to stop.`)}ui()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b||b.tagName==='CANVAS')return;if(AC&&AC.state==='suspended')AC.resume();act(b.dataset.k,b)});
$('#bCollect').onclick=collectAll;$('#bMute').onclick=()=>act('mute');
document.addEventListener('change',e=>{if(e.target.id==='aiT'){S.ai=e.target.checked;changed();renderRanks()}if(e.target.id==='snd'){S.mute=!e.target.checked;changed()}if(e.target.id==='lblT'){S.lbl=e.target.checked;changed()}});
document.addEventListener('keydown',e=>{const tg=e.target.tagName;if(tg==='INPUT'&&e.target.type==='text'){if(e.key==='Enter'){if(e.target.id==='tn')act('found');if(e.target.id==='rn')act('rename')}return}
 const mo=$('#modal').classList.contains('open');if(e.key==='Escape'){if(mo)act('mclose');else if(plantMode)setPlant(false);else closePanel();return}
 if(mo){if(game&&game.t==='sort'&&'123'.includes(e.key))binPick(+e.key-1);if(game&&game.t==='quiz'&&'123'.includes(e.key))answer(+e.key-1);return}
 const k=e.key.toLowerCase(),m={t:'tasks',u:'build',b:'build',d:'plant',p:'plant',q:'quiz',s:'sort',e:'lights',l:'lights',r:'ranks',g:'guide',h:'guide',n:'labels',v:'rate',c:'center',m:'mute','+':'zin','=':'zin','-':'zout'}[k];
 if(e.key===' '){e.preventDefault();collectAll();return}
 if(e.key.startsWith('Arrow')){e.preventDefault();const d=40;if(e.key==='ArrowLeft')cam.x+=d;if(e.key==='ArrowRight')cam.x-=d;if(e.key==='ArrowUp')cam.y+=d;if(e.key==='ArrowDown')cam.y-=d;return}
 if(m)act(m)});

/* ---------- Boot ---------- */
new ResizeObserver(resize).observe(cv);resize();
if(innerWidth<700)$('#mission').classList.add('min');
fillTasks();for(let k=0;k<3;k++)spawnLitter();
ui();requestAnimationFrame(frame);
let lastR=null;setInterval(()=>{ui();if(S.intro&&!S.rated&&!S.ratePrompted&&(S.level>=2||Date.now()-T0>240000)&&!$('#modal').classList.contains('open')){S.ratePrompted=true;changed();rateModal()}if(panelName==='bld'){const s=SL[panelArg],r=ready(s);if(r!==lastR){lastR=r;renderDrawer()}else if(!r&&$('#bst'))$('#bst').textContent='Ready in '+Math.max(0,Math.ceil((K[s.k].c*1000-(Date.now()-S.prod[s.id]))/1000))+'s'}},1000);
if(!S.town)welcome();else if(!S.intro)intro(0);coach();
comm();initCloud();
}
</script>

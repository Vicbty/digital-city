<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1f4" />
    <!-- iPhone : ajout à l'écran d'accueil -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Digital City" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>Digital City — sauveras-tu le pire data center de France ?</title>
    <meta name="description" content="Tu hérites du data center le plus polluant de France. Réponds au quiz, gagne des pièces, rends-le sobre. 3 niveaux, bats le score de tes potes !" />

    <!-- Open Graph (WhatsApp, Insta, LinkedIn…) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Digital City" />
    <meta property="og:title" content="🏙️ Digital City — sauveras-tu le pire data center de France ?" />
    <meta property="og:description" content="Réponds au quiz, gagne des pièces et transforme le pire data center en champion du numérique sobre. Défie tes potes !" />
    <!-- Après le 1er déploiement, remplacer par l'URL absolue (ex. https://digital-city.vercel.app/og.png) -->
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="🏙️ Digital City" />
    <meta name="twitter:description" content="Transforme le pire data center en champion du numérique sobre !" />
    <meta name="twitter:image" content="/og.png" />
  </head>
  <body>
    <div id="root">
      <!-- Affiché tant que le jeu n'a pas démarré : évite une page blanche. -->
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;font-family:-apple-system,system-ui,sans-serif;color:#1b232c;background:#eef1f4;text-align:center">
        <img src="/apple-touch-icon.png" width="72" height="72" alt="" style="border-radius:16px" />
        <strong style="font-size:20px">Digital City</strong>
        <span id="boot-msg" style="color:#5d6b79">Chargement…</span>
      </div>
    </div>
    <script>
      // Si le jeu plante avant de s'afficher, on montre l'erreur au lieu d'une page blanche.
      ;(function () {
        function show(text) {
          if (window.__dcMounted) return
          var el = document.getElementById('boot-msg')
          if (el) el.innerHTML = text
        }
        window.addEventListener('error', function (e) {
          show('Oups, le jeu n\'a pas pu démarrer.<br><small>' + (e.message || 'erreur inconnue') + '</small>')
        })
        window.addEventListener('unhandledrejection', function (e) {
          show('Oups, le jeu n\'a pas pu démarrer.<br><small>' + ((e.reason && e.reason.message) || 'erreur inconnue') + '</small>')
        })
        setTimeout(function () {
          show('Le jeu met du temps à charger… Vérifie ta connexion, ou ouvre le lien dans Safari.')
        }, 10000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
